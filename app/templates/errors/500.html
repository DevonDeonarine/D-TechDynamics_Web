{% extends "layouts/base.html" %}
{% block title %}Server Error | {{ company_name }}{% endblock %}
{% block content %}
<div class="container">
  <div class="scaffold-notice glass-panel">
    <span class="scaffold-notice__badge">500</span>

  </div>
</div>
{% endblock %}
