{% extends "layouts/base.html" %}
{% block title %}Page Not Found | {{ company_name }}{% endblock %}
{% block content %}
<div class="container">
  <div class="scaffold-notice glass-panel">
    <span class="scaffold-notice__badge">404</span>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Back to Home</a>
  </div>
</div>
{% endblock %}
