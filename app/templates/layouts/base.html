<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ page_title }} | {{ company_name }}{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}{{ company_name }} — {{ company_tagline }}{% endblock %}">

  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/dtech-logo.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body>

  {% include "components/navbar.html" %}

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  {% include "components/footer.html" %}

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
